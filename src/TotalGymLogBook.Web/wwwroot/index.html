<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Total Gym Logbook</title>
    <base href="/" />
    <meta name="description" content="Track your Total Gym workouts. Free, works offline, your data stays on your device." />
    <!-- The status bar takes its color from here when the app is installed to the Home Screen,
         so it has to match the nav bar's material in BOTH appearances -- a single value leaves
         a light strip above a black app, which is the most visible way to look non-native. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 'default' rather than 'black-translucent': translucent pins the status bar text to
         white, which disappears against the light appearance. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Total Gym Logbook" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <!-- 180 is what a modern iPhone actually asks for. Without it Safari takes the 512 and
         downscales, softening the strokes at the size they are hardest to read. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <!--
      DO NOT REMOVE. Populated at publish time with the fingerprint map for the .NET runtime
      files. Without it the loader requests _framework/dotnet.js, which does not exist -- the
      published file is dotnet.<hash>.js -- and Blazor dies with
      "Failed to start platform: Failed to fetch dynamically imported module".

      This does not reproduce under `dotnet run`: the DevServer resolves unfingerprinted names
      itself, so the app looks fine locally and is broken on any static host, which is exactly
      how Azure Static Web Apps serves it. Verified by offline-check.mjs.
    -->
    <script type="importmap"></script>

    <!-- docs/adr/0003: critical CSS is inlined so first paint needs zero round trips.
         Everything else is deferred.

         This block is the design SYSTEM; src/client/src/shell/theme.ts is the components built
         out of it. Tokens have to live here rather than there because custom properties inherit
         through shadow boundaries and stylesheets do not -- Blazor's light-DOM views and the
         shell's eleven shadow roots can only agree on a color if it is declared once, above
         both of them. -->
    <style>
        :root {
            color-scheme: light dark;

            /* Apple's system colors, light appearance. Named for what they ARE in the HIG so
               the next person can look them up rather than guess what #f2f2f7 meant. */
            --system-blue: #007aff;
            --system-green: #34c759;
            --system-orange: #ff9500;
            --system-red: #ff3b30;
            --system-gray: #8e8e93;

            --bg: #f2f2f7;                      /* systemGroupedBackground */
            --surface: #ffffff;                 /* secondarySystemGroupedBackground */
            --fg: #000000;                      /* label */
            --muted: rgb(60 60 67 / .6);        /* secondaryLabel */
            --faint: rgb(60 60 67 / .3);        /* tertiaryLabel */
            --separator: rgb(60 60 67 / .29);
            --fill: rgb(120 120 128 / .12);     /* tertiarySystemFill -- field backgrounds */
            --fill-strong: rgb(120 120 128 / .2);
            --material: rgb(249 249 249 / .8);  /* the nav bar's blurred material */
            /* The moving thumb of a segmented control. Not --surface: in dark appearance the
               selected segment is a LIGHTER gray than the trough, not the card color, or the
               selection disappears into the group it is sitting on. */
            --segment-thumb: #ffffff;

            --accent: var(--system-blue);
            --accent-tint: rgb(0 122 255 / .15);
            --warn: #b25000;                    /* systemOrange, darkened to pass contrast on text */
            --danger: var(--system-red);
            /* A card that needs attention is TINTED, never outlined -- iOS almost never draws a
               border. Declared twice on purpose: a browser without color-mix drops the second
               declaration and keeps the flat fallback rather than losing the tint entirely. */
            --surface-warn: #fff2e0;
            --surface-warn: color-mix(in srgb, var(--system-orange) 12%, var(--surface));

            /* Legacy alias. Rules written before the palette existed still say --border, and a
               separator is what every one of them meant. */
            --border: var(--separator);

            /* iOS text styles at their default (Large) Dynamic Type size. */
            --text-large-title: 2.125rem;  /* 34 */
            --text-title1: 1.75rem;        /* 28 */
            --text-title3: 1.25rem;        /* 20 */
            --text-headline: 1.0625rem;    /* 17, semibold */
            --text-body: 1.0625rem;        /* 17 */
            --text-callout: 1rem;          /* 16 */
            --text-subhead: .9375rem;      /* 15 */
            --text-footnote: .8125rem;     /* 13 */
            --text-caption: .75rem;        /* 12 */
            --text-caption2: .6875rem;     /* 11 */
            --text-metric: 2.5rem;

            --radius-card: .625rem;        /* 10pt, the inset grouped list corner */
            --radius-control: .75rem;
            --radius-field: .625rem;
            --radius-small: .5rem;
            --tap: 2.75rem;                /* 44pt. The floor for anything tappable. */
            --gutter: 1rem;
            --card-pad-y: .75rem;
            --group-gap: 1.25rem;
            --hairline: 1px;

            /* SF Pro on Apple hardware, and its optical sizing, which system-ui alone does not
               guarantee. SF Rounded is what iOS uses for numbers that are the content. */
            --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
                         "Segoe UI", Roboto, sans-serif;
            --font-rounded: ui-rounded, "SF Pro Rounded", var(--font-text);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --system-blue: #0a84ff;
                --system-green: #30d158;
                --system-orange: #ff9f0a;
                --system-red: #ff453a;

                --bg: #000000;
                --surface: #1c1c1e;
                --fg: #ffffff;
                --muted: rgb(235 235 245 / .6);
                --faint: rgb(235 235 245 / .3);
                --separator: rgb(84 84 88 / .65);
                --fill: rgb(120 120 128 / .24);
                --fill-strong: rgb(120 120 128 / .36);
                --material: rgb(30 30 30 / .8);
                --segment-thumb: #636366;
                --accent-tint: rgb(10 132 255 / .22);
                --warn: #ff9f0a;
                --surface-warn: #2e271d;
                --surface-warn: color-mix(in srgb, var(--system-orange) 12%, var(--surface));
            }
        }

        /* A separator is one physical pixel, which on a Retina screen is not one CSS pixel.
           Drawing it at 1px there gives a line twice as heavy as anything iOS draws. */
        @media (min-resolution: 2dppx) {
            :root { --hairline: .5px; }
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--fg);
            font: var(--text-body)/1.45 var(--font-text);
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            /* No text selection on chrome, no blue flash on tap, no rubber-banding past the
               app -- the three things that give a web app away within one gesture. */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overscroll-behavior-y: contain;
            /* Only the sides and the bottom. The top inset belongs to the nav bar, which has to
               extend UNDER the status bar for its blur to look like iOS rather than like a
               floating gray box. */
            padding: 0 env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        /* Fields and readouts are still selectable -- a trainee may want to copy a number. */
        input, textarea { -webkit-user-select: auto; user-select: auto; }

        #app { min-height: 100dvh; }
        #blazor-error-ui {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: #fde047; color: #111418; padding: .75rem 1rem;
            box-shadow: 0 -1px 4px rgb(0 0 0 / .3);
        }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>
    <!-- Painted and interactive before the .NET runtime exists. docs/adr/0003. -->
    <div id="app">
        <tg-app-shell>
            <!--
              Blazor's mount point (docs/adr/0003 rule 5: Blazor owns this element, the shell
              owns everything else). It is a LIGHT-DOM child of the shell, projected into the
              shell's <slot name="derived"> so the coach and history render where a trainee
              would look for them -- under the workout, above the data card -- instead of
              stranded at the bottom of the page.

              Light DOM is what makes that safe. The shell rewrites its shadow root on every
              screen change; this element is untouched by that, so the .NET runtime can boot
              into it whenever it finishes, whatever the shell is showing. On screens with no
              slot (onboarding, resume) it simply is not rendered.
            -->
            <div id="blazor-root" slot="derived"></div>
        </tg-app-shell>
    </div>

    <tg-update-banner></tg-update-banner>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- The instant tier. Registers custom elements and opens IndexedDB. -->
    <script type="module" src="dist/shell.js"></script>

    <!--
      docs/adr/0003 step 3: autostart="false" and start Blazor MANUALLY after the shell has
      painted. Autostart contends with first paint for the main thread, which is the whole
      thing this architecture exists to avoid.
    -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script type="module">
        // Yield to the shell's first paint, then boot the runtime. Everything Blazor renders
        // is progressive enhancement over an already-usable app.
        const root = document.getElementById('blazor-root');

        // A boot failure here is invisible: the shell keeps working, so the app looks fine and
        // the coach simply never appears. There is no console on a phone, so say it on the page.
        const reportBootFailure = (detail) => {
            if (root.childElementCount > 0) return;
            root.innerHTML =
                '<p style="color:var(--muted);font-size:.75rem;margin:1.5rem 0 0;' +
                'border-top:1px solid var(--border);padding-top:1rem">' +
                'The coach could not load on this browser. Logging still works and your data is safe.' +
                '<br><span style="font-size:.7rem;opacity:.8"></span></p>';
            root.querySelector('span').textContent = String(detail).slice(0, 300);
        };

        const startBlazor = () => {
            try {
                Blazor.start().catch(reportBootFailure);
            } catch (error) {
                reportBootFailure(error);
            }
        };

        // MUST be `typeof`, not `requestIdleCallback?.(...)`. Optional call guards a null or
        // undefined VALUE; it does not guard an UNDECLARED IDENTIFIER, which throws a
        // ReferenceError and kills this module before Blazor.start() is ever reached.
        //
        // Safari has never shipped requestIdleCallback -- it is still behind a preference in
        // Technology Preview -- so the previous version of this line meant the derived tier had
        // NEVER booted on any iPhone or iPad, while working perfectly in every desktop browser
        // and in the headless Chromium the e2e suite drives. See docs/adr/0003.
        const schedule = () =>
            typeof requestIdleCallback === 'function'
                ? requestIdleCallback(startBlazor, { timeout: 1000 })
                // Safari has no idle callback, so yield explicitly instead. Long enough for the
                // shell to paint first, which is the only reason this is deferred at all.
                : setTimeout(startBlazor, 200);

        if (document.readyState === 'complete') {
            schedule();
        } else {
            window.addEventListener('load', schedule);
        }
    </script>

    <!-- The service worker is registered from the shell bundle instead of here, because the
         registration is only half the job: something has to notice a new build and offer it.
         See src/client/src/updates.ts. -->
</body>

</html>
