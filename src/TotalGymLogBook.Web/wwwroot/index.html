<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Total Gym Logbook</title>
    <base href="/" />
    <meta name="description" content="Track your Total Gym workouts. Free, works offline, your data stays on your device." />
    <meta name="theme-color" content="#111418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <!--
      DO NOT REMOVE. Populated at publish time with the fingerprint map for the .NET runtime
      files. Without it the loader requests _framework/dotnet.js, which does not exist -- the
      published file is dotnet.<hash>.js -- and Blazor dies with
      "Failed to start platform: Failed to fetch dynamically imported module".

      This does not reproduce under `dotnet run`: the DevServer resolves unfingerprinted names
      itself, so the app looks fine locally and is broken on any static host, which is exactly
      how Azure Static Web Apps serves it. Verified by offline-check.mjs.
    -->
    <script type="importmap"></script>

    <!-- docs/adr/0003: critical CSS is inlined so first paint needs zero round trips.
         Everything else is deferred. -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff; --fg: #111418; --muted: #5c6672; --accent: #0b6bcb;
            --surface: #f4f6f8; --border: #d8dee4;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #111418; --fg: #e8ecf0; --muted: #9aa5b1; --accent: #4c9aff;
                    --surface: #1a1f26; --border: #2b323b; }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--fg);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-text-size-adjust: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #app { min-height: 100dvh; }
        #blazor-error-ui {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: #fde047; color: #111418; padding: .75rem 1rem;
            box-shadow: 0 -1px 4px rgb(0 0 0 / .3);
        }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>
    <!-- Painted and interactive before the .NET runtime exists. docs/adr/0003. -->
    <div id="app">
        <tg-app-shell>
            <!--
              Blazor's mount point (docs/adr/0003 rule 5: Blazor owns this element, the shell
              owns everything else). It is a LIGHT-DOM child of the shell, projected into the
              shell's <slot name="derived"> so the coach and history render where a trainee
              would look for them -- under the workout, above the data card -- instead of
              stranded at the bottom of the page.

              Light DOM is what makes that safe. The shell rewrites its shadow root on every
              screen change; this element is untouched by that, so the .NET runtime can boot
              into it whenever it finishes, whatever the shell is showing. On screens with no
              slot (onboarding, resume) it simply is not rendered.
            -->
            <div id="blazor-root" slot="derived"></div>
        </tg-app-shell>
    </div>

    <tg-update-banner></tg-update-banner>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- The instant tier. Registers custom elements and opens IndexedDB. -->
    <script type="module" src="dist/shell.js"></script>

    <!--
      docs/adr/0003 step 3: autostart="false" and start Blazor MANUALLY after the shell has
      painted. Autostart contends with first paint for the main thread, which is the whole
      thing this architecture exists to avoid.
    -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script type="module">
        // Yield to the shell's first paint, then boot the runtime. Everything Blazor renders
        // is progressive enhancement over an already-usable app.
        const root = document.getElementById('blazor-root');

        // A boot failure here is invisible: the shell keeps working, so the app looks fine and
        // the coach simply never appears. There is no console on a phone, so say it on the page.
        const reportBootFailure = (detail) => {
            if (root.childElementCount > 0) return;
            root.innerHTML =
                '<p style="color:var(--muted);font-size:.75rem;margin:1.5rem 0 0;' +
                'border-top:1px solid var(--border);padding-top:1rem">' +
                'The coach could not load on this browser. Logging still works and your data is safe.' +
                '<br><span style="font-size:.7rem;opacity:.8"></span></p>';
            root.querySelector('span').textContent = String(detail).slice(0, 300);
        };

        const startBlazor = () => {
            try {
                Blazor.start().catch(reportBootFailure);
            } catch (error) {
                reportBootFailure(error);
            }
        };

        // MUST be `typeof`, not `requestIdleCallback?.(...)`. Optional call guards a null or
        // undefined VALUE; it does not guard an UNDECLARED IDENTIFIER, which throws a
        // ReferenceError and kills this module before Blazor.start() is ever reached.
        //
        // Safari has never shipped requestIdleCallback -- it is still behind a preference in
        // Technology Preview -- so the previous version of this line meant the derived tier had
        // NEVER booted on any iPhone or iPad, while working perfectly in every desktop browser
        // and in the headless Chromium the e2e suite drives. See docs/adr/0003.
        const schedule = () =>
            typeof requestIdleCallback === 'function'
                ? requestIdleCallback(startBlazor, { timeout: 1000 })
                // Safari has no idle callback, so yield explicitly instead. Long enough for the
                // shell to paint first, which is the only reason this is deferred at all.
                : setTimeout(startBlazor, 200);

        if (document.readyState === 'complete') {
            schedule();
        } else {
            window.addEventListener('load', schedule);
        }
    </script>

    <!-- The service worker is registered from the shell bundle instead of here, because the
         registration is only half the job: something has to notice a new build and offer it.
         See src/client/src/updates.ts. -->
</body>

</html>
